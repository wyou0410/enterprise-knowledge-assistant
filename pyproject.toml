[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Standalone knowledge question-answering CLI; synthetic demo and explicit live APIs"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
readme = "README.md"

dependencies = ["requests==2.34.2", "beautifulsoup4==4.15.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.urls]
Repository = "https://github.com/wyou0410/enterprise-knowledge-assistant"
Issues = "https://github.com/wyou0410/enterprise-knowledge-assistant/issues"

[project.scripts]
knowledge-assistant = "knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
