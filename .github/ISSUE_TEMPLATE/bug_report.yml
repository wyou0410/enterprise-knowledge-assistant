name: Bug report
description: Report a reproducible problem without secrets or private traces.
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command, Python/OS versions and demo/live mode. Remove credentials and private text.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, private passages or sensitive logs.
          required: true
